<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B0F1E">
  <meta name="description" content="Obsidian — a beautiful offline-first music player and playlist manager. Play local files, discover tracks via Audius and iTunes, sync lyrics, and blend music profiles.">
  <title>Obsidian — Music, in focus</title>

  <!-- Preconnect for Google Fonts (themes.css imports Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-shell">

    <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Obsidian home">
        <span class="brand-mark">◈</span> obsidian
      </a>

      <p class="side-label">YOUR SPACE</p>
      <nav id="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="home">    <span>⌂</span> Home</button>
        <button class="nav-item"        data-page="explore"> <span>◉</span> Explore</button>
        <button class="nav-item"        data-page="search">  <span>⌕</span> Search</button>
        <button class="nav-item"        data-page="library"> <span>▤</span> My Music</button>
        <button class="nav-item"        data-page="liked">   <span>♥</span> Liked Songs</button>
        <button class="nav-item"        data-page="playlists"><span>▦</span> Playlists</button>
        <button class="nav-item"        data-page="blend">   <span>✳</span> Blend</button>
      </nav>

      <div class="side-divider"></div>
      <p class="side-label">YOUR PLAYLISTS</p>
      <div id="sidebar-playlists" class="sidebar-playlists"></div>

      <div class="sidebar-bottom">
        <button class="nav-item" data-page="plans">
          <span>✦</span> Plans <span class="premium-mini">DEMO</span>
        </button>
        <button class="nav-item" data-page="settings">
          <span>⚙</span> Settings
        </button>
        <div class="local-note">
          <span class="online-dot"></span> Your library stays yours
        </div>
      </div>
    </aside>

    <!-- ── Main area ─────────────────────────────────────────────────────────── -->
    <main class="main-area">

      <!-- Top bar -->
      <header class="topbar">
        <button class="mobile-brand" data-page="home">◈ obsidian</button>
        <label class="global-search" for="global-search" aria-label="Search music">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search"
            placeholder="Songs, artists, or a mood…"
            aria-label="Search music"
            autocomplete="off">
          <kbd title="Press / to focus search">/</kbd>
        </label>
        <div class="top-actions">
          <button class="icon-button" id="theme-toggle" title="Cycle time palette" aria-label="Cycle time palette">☼</button>
          <button class="mood-top"    id="top-mood"    title="Change mood">☀ Happy</button>
          <span   id="premium-badge" class="premium-badge hidden">✦ PREMIUM</span>
          <button class="avatar" data-page="settings" aria-label="Settings" title="Settings">⚙</button>
        </div>
      </header>

      <!-- Offline banner -->
      <div id="offline-banner" class="offline-banner hidden" role="status">
        ⚡ You're offline. Your local music still works.
      </div>

      <!-- Toast -->
      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <!-- Page content -->
      <section id="content" class="content" tabindex="-1" aria-live="polite"></section>

    </main>
  </div><!-- /.app-shell -->

  <!-- ── Player bar ──────────────────────────────────────────────────────────── -->
  <footer class="player" id="player" aria-label="Playback controls">

    <!-- Now playing -->
    <div class="now-playing">
      <button id="player-art" class="mini-art" aria-label="Open Now Playing view">◈</button>
      <div class="track-copy">
        <strong id="player-title">Choose a song</strong>
        <span   id="player-artist">Your music, your way</span>
      </div>
      <button id="like-current" class="heart-button" aria-label="Like current song">♡</button>
    </div>

    <!-- Transport -->
    <div class="transport">
      <div class="transport-buttons">
        <button id="shuffle-button"  class="player-icon" title="Shuffle (off)" aria-label="Shuffle">⤨</button>
        <button id="previous-button" class="player-icon" title="Previous (Shift+←)" aria-label="Previous">⏮</button>
        <button id="play-button"     class="play-button" title="Play / Pause (Space)" aria-label="Play">▶</button>
        <button id="next-button"     class="player-icon" title="Next (Shift+→)" aria-label="Next">⏭</button>
        <button id="repeat-button"   class="player-icon" title="Repeat off" aria-label="Repeat">↻</button>
      </div>
      <div class="seek-row">
        <span id="current-time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Tools (right) -->
    <div class="player-tools">
      <canvas id="visualizer" width="92" height="28" aria-label="Audio visualizer" aria-hidden="true"></canvas>
      <button id="spatial-button" class="tool-pill" title="Spatial Sound">
        ◉ <span>Spatial</span>
      </button>
      <button id="lyrics-button" class="player-icon" title="Lyrics (L)" aria-label="Lyrics">♪</button>
      <button id="queue-button"  class="player-icon" title="Up Next" aria-label="Up Next">☷</button>
      <button id="mute-button"   class="player-icon" title="Mute (M)" aria-label="Mute">◖))</button>
      <input  id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume">
    </div>

  </footer><!-- /.player -->

  <!-- ── Drawer (Up Next + history) ───────────────────────────────────────── -->
  <div id="drawer-scrim" class="drawer-scrim"></div>
  <aside id="drawer" class="drawer" aria-label="Up Next and history"></aside>

  <!-- ── Modals ────────────────────────────────────────────────────────────── -->
  <div id="modal-root"></div>

  <!-- ── Audio elements ────────────────────────────────────────────────────── -->
  <!--
    Two separate <audio> elements — one for local files (no crossOrigin so
    Web Audio can process them freely), one for remote streams (crossOrigin set
    conditionally by audio.js on CORS success/failure).
  -->
  <audio id="local-audio"  preload="metadata"></audio>
  <audio id="remote-audio" preload="metadata" crossorigin="anonymous"></audio>

  <!--
    Script load order matters — no ES modules so file:// protocol works.
    ds.js defines ObsidianDS, which api.js/audio.js/app.js all depend on.
  -->
  <script src="js/ds.js"></script>
  <script src="js/api.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/blend.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
